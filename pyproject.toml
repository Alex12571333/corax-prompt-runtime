[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "corax-prompt-runtime"
version = "0.1.4"
description = "Cache-stable layered Markdown prompt runtime for Corax."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Corax"}]
dependencies = [
  "agent-core @ git+https://github.com/Alex12571333/agent-core.git",
  "agent-sdk @ git+https://github.com/Alex12571333/agent-sdk.git"
]

[tool.setuptools.packages.find]
include = ["corax_prompt_runtime*"]

[tool.setuptools.data-files]
"prompts/core" = ["prompts/core/*.md"]
"prompts/behavior" = ["prompts/behavior/*.md"]
"prompts/services" = ["prompts/services/*.md"]
"prompts/channels" = ["prompts/channels/*.md"]
"prompts/templates" = ["prompts/templates/*.md"]
